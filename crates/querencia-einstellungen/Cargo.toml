[package]
name = "querencia-einstellungen"
version = "0.1.0"
description = "Querencia Einstellungen – Kontrollzentrum im Stil von GNOME 2 (Hintergrund QE-01, Bildschirm G2-G, Symbole der Arbeitsfläche G2-X, Standardanwendungen G2-Z, Fenstersymbol G2-AA, Galerie der Hintergründe G2-AF, Tastatur, Maus, Fensterdesign, Arbeitsflächen G2-AG, Erscheinungsbild, Schriften, Galerie auf der Seite G2-AJ, Sprache und Region, mehrere Tastaturbelegungen, deutsch/englisch über gettext 0.1.0)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Wie querencia-panel/-desktop: GTK 4 ohne libadwaita, labwc zeichnet die Titelleiste.
gtk4 = { version = "0.11", features = ["v4_10"] }
# rc.xml nur lesen (Ist-Werte der Bereiche); liegt im Cargo-Cache (offline).
roxmltree = "0.21"
# schnelle Suche nach „--faehigkeiten“ im Desktop-Binary (liegt bereits im Lockfile)
memchr = "2.8"
# Bereich Bildschirm (G2-G): wlr-output-management direkt am Compositor, wie
# der Screenshot 0.2.5 (liegt im Cargo-Cache, offline).
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Übersetzungen über GNU gettext (po/, .mo unter share/locale), Muster
# docs/i18n-muster.md des Editors. Feature gettext-system: das gettext der
# glibc statt eines mitgebauten libintl.
gettext-rs = { version = "0.8", features = ["gettext-system"] }
