<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Querencia Treiber</title>
  <desc id="description">Grafikkarte mit Lüfter in Querencia-Orange (#F07746), grauem Umriss, Slotblech links und Kontaktleiste unten, flächig wie das Zahnrad der Einstellungen (Einstellungen 0.2.0).</desc>
  <!-- Slotblech -->
  <path d="M5 12 L10 12 L10 50 L5 50 Z" fill="#c9c7c3" stroke="#5a5a5a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Platine -->
  <rect x="10" y="14" width="50" height="32" rx="3" fill="#f4f3f1" stroke="#5a5a5a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Kontaktleiste -->
  <path d="M18 46 L18 53 L48 53 L48 46" fill="#F07746" stroke="#5a5a5a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M23 47.5 L23 51.5 M28 47.5 L28 51.5 M33 47.5 L33 51.5 M38 47.5 L38 51.5 M43 47.5 L43 51.5" stroke="#5a5a5a" stroke-width="1.6"/>
  <!-- Lüfter -->
  <circle cx="40" cy="30" r="11.5" fill="#F07746" stroke="#5a5a5a" stroke-width="3"/>
  <path d="M40 30 L40 20.5 M40 30 L48.2 34.8 M40 30 L31.8 34.8" stroke="#f4f3f1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40" cy="30" r="3.2" fill="#f4f3f1" stroke="#5a5a5a" stroke-width="2"/>
  <!-- Chip -->
  <rect x="15" y="21" width="11" height="11" rx="1.5" fill="#5a5a5a"/>
</svg>
